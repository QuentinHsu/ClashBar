  - RULE-SET, direct, Global Direct
  - RULE-SET, bilibili, Global Direct
  - RULE-SET, chinamedia, Global Direct
  - RULE-SET, chinamax, Global Direct
  - GEOIP, CN, Global Direct, no-resolve

  ##### Self Node ######
