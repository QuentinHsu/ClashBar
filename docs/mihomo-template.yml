mixed-port: 7890
allow-lan: true
log-level: info
mode: rule
ipv6: true
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
geo-update-interval: 24
geox-url:
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com

dns:
  enable: true
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - +.local
    - time.*.com
    - time.*.gov
    - +.market.xiaomi.com
    - +.push.apple.com
  nameserver-policy:
    geosite:cn:
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    geosite:private:
      - 223.5.5.5
      - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - quic://dns.alidns.com
  fallback:
    - tls://8.8.4.4
    - tls://1.1.1.1
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver-follow-policy: true
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - +.google.com
      - +.googleapis.com
      - +.gstatic.com
      - +.youtube.com
      - +.facebook.com
      - +.twitter.com
      - +.x.com
      - +.openai.com
      - +.githubusercontent.com
proxies:

  


proxy-providers:
  sub: &proxy_provider_base
    type: http
    url: https://www.mihomo.me/api/v1/proxies?secret=xxx
    header:
      User-Agent:
        - mihomo/1.18.3
    interval: 86400
    path: ./proxy-providers/sub.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    exclude-filter: 过期|剩余|套餐|域名|更新|客服|优先|官网|软件|IOS|安卓|Mac|频道|卸载|选择
  sub2:
    <<: *proxy_provider_base
    url: https://www.mihomo.me/api/v1/proxies?secret=xxx
    path: ./proxy-providers/sub2.yaml

proxy-groups:
  - name: Self Node
    type: select
    proxies:

  - name: Sub
    type: select
    use:
      - sub
      - sub2
  - name: Auto Sub
    type: url-test
    use:
      - sub
      - sub2
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: Global Proxy
    type: select
    proxies:
      - Self Node
      - Sub
      - Auto Sub
  - name: Final
    type: select
    proxies:
      - Global Proxy
      - DIRECT
  - name: Global Direct
    type: select
    proxies:
      - DIRECT
      - Global Proxy
  - name: AdBlock
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: Apple
    type: select
    proxies: &direct_or_global_proxy
      - DIRECT
      - Global Proxy
  - name: Cursor
    type: select
    proxies: &self_or_sub
      - Self Node
      - Sub
  - name: GitHub
    type: select
    proxies: *self_or_sub
  - name: Google
    type: select
    proxies: *self_or_sub
  - name: Microsoft
    type: select
    proxies: *direct_or_global_proxy
  - name: OpenAI
    type: select
    proxies: *self_or_sub
  - name: Twitter
    type: select
    proxies: *self_or_sub
  - name: Telegram
    type: select
    proxies: *self_or_sub
  - name: Gaming
    type: select
    proxies: *direct_or_global_proxy
  - name: Streaming
    type: select
    proxies:
      - Global Proxy
      - DIRECT
  - name: Speedtest
    type: select
    proxies: *direct_or_global_proxy

